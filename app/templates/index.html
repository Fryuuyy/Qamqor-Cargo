<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fa">
  <title>Qamqor Cargo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="app-frame">
    <header class="topbar">
      <a class="brand" href="#dashboard" aria-label="Qamqor Cargo">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M16 4v24M4 16h24M7.5 7.5l17 17m0-17-17 17" /></svg></span>
        <span class="brand-name">Qamqor <span>Cargo</span></span>
      </a>
      <nav class="main-nav" data-i18n-aria="nav.aria" aria-label="Main navigation">
        <a class="nav-link is-active" href="#dashboard" data-view="dashboard" data-i18n="nav.dashboard"></a>
        <a class="nav-link" href="#transportations" data-view="transportations" data-i18n="nav.transportations"></a>
        <a class="nav-link" href="#planning" data-view="planning" data-i18n="nav.planning"></a>
        <a class="nav-link" href="#rates" data-view="rates" data-i18n="nav.rates"></a>
        <a class="nav-link" href="#settings" data-view="settings" data-i18n="nav.settings"></a>
      </nav>
      <div class="top-actions">
        <label class="language-control">
          <span class="sr-only" data-i18n="language.label"></span>
          <select id="languageSelect" data-i18n-aria="language.label" aria-label="Language">
            <option value="kk">ҚАЗ</option>
            <option value="ru">РУС</option>
          </select>
        </label>
        <div id="guestActions" class="auth-actions">
          <button class="btn btn-quiet" id="loginOpen" data-i18n="auth.login"></button>
          <button class="btn btn-primary" id="registerOpen" data-i18n="auth.register"></button>
        </div>
        <button class="profile-button hidden" id="accountButton" type="button">
          <span class="profile-avatar" aria-hidden="true">Q</span>
          <span id="profileLabel"></span>
        </button>
      </div>
    </header>

    <main class="main-content">
      <section class="screen is-active" id="view-dashboard" data-screen="dashboard">
        <div class="screen-heading">
          <div>
            <span class="eyebrow" data-i18n="dashboard.eyebrow"></span>
            <h1><span data-i18n="dashboard.title"></span> <em data-i18n="dashboard.titleAccent"></em></h1>
            <p data-i18n="dashboard.subtitle"></p>
          </div>
          <span class="service-status"><i></i><span data-i18n="dashboard.online"></span></span>
        </div>
        <article class="hero-card">
          <img class="hero-truck" src="/static/images/hero-truck.jpg" alt="" fetchpriority="high">
          <div class="hero-shade"></div>
          <div class="hero-copy">
            <span class="hero-kicker" data-i18n="dashboard.heroKicker"></span>
            <h2 data-i18n="dashboard.heroTitle"></h2>
            <p data-i18n="dashboard.heroText"></p>
            <button class="btn btn-primary btn-large" type="button" data-navigate="planning"><span data-i18n="dashboard.createShipment"></span><span aria-hidden="true">↗</span></button>
          </div>
          <div class="hero-tag"><span class="hero-tag-icon">Q</span><span><small data-i18n="brand.label"></small><strong>Qamqor Cargo</strong></span></div>
        </article>
        <div class="dashboard-metrics" data-i18n-aria="dashboard.metricsAria" aria-label="Shipment summary">
          <article class="metric-card"><span class="metric-icon orange">↗</span><div><small data-i18n="metrics.total"></small><strong id="metricTotal">0</strong></div></article>
          <article class="metric-card"><span class="metric-icon blue">⌁</span><div><small data-i18n="metrics.inTransit"></small><strong id="metricTransit">0</strong></div></article>
          <article class="metric-card"><span class="metric-icon green">✓</span><div><small data-i18n="metrics.delivered"></small><strong id="metricDelivered">0</strong></div></article>
          <article class="metric-card"><span class="metric-icon slate">◷</span><div><small data-i18n="metrics.pending"></small><strong id="metricPending">0</strong></div></article>
        </div>

        <div class="dashboard-grid">
          <article class="panel shipment-info-panel">
            <div class="panel-heading">
              <div><span class="eyebrow" data-i18n="card.shipmentInfo.kicker"></span><h2 data-i18n="card.shipmentInfo.title"></h2></div>
              <button class="icon-button" type="button" data-navigate="transportations" data-i18n-aria="actions.openTransportations" aria-label="Open transportations">↗</button>
            </div>
            <div class="shipment-summary" id="dashboardLatest"></div>
          </article>
          <article class="panel tracking-panel">
            <div class="panel-heading"><div><span class="eyebrow" data-i18n="card.tracking.kicker"></span><h2 data-i18n="card.tracking.title"></h2></div><span class="tracking-mark">⌖</span></div>
            <div id="trackingDetails" data-i18n="tracking.empty"></div>
          </article>
          <article class="panel route-panel">
            <div class="panel-heading"><div><span class="eyebrow" data-i18n="card.route.kicker"></span><h2 data-i18n="card.route.title"></h2></div><span class="tracking-mark">⌁</span></div>
            <div class="route-map" aria-hidden="true"><span class="map-road road-one"></span><span class="map-road road-two"></span><span class="route-line"></span><i class="route-pin pin-origin"></i><i class="route-pin pin-destination"></i><span class="map-label origin-label" id="mapOrigin" data-i18n="route.originPlaceholder"></span><span class="map-label destination-label" id="mapDestination" data-i18n="route.destinationPlaceholder"></span></div>
            <div class="route-summary"><div><small data-i18n="route.from"></small><strong id="routeOrigin">—</strong></div><span class="route-arrow">→</span><div><small data-i18n="route.to"></small><strong id="routeDestination">—</strong></div></div>
          </article>
          <article class="panel vehicle-panel">
            <div class="panel-heading"><div><span class="eyebrow" data-i18n="card.vehicle.kicker"></span><h2 data-i18n="card.vehicle.title"></h2></div><span class="vehicle-symbol">◉</span></div>
            <div class="vehicle-status"><span class="vehicle-status-icon">✓</span><div><strong data-i18n="vehicle.workflowTitle"></strong><small data-i18n="vehicle.workflowText"></small></div></div>
            <div class="vehicle-note"><span class="note-dot"></span><span data-i18n="vehicle.telemetryNote"></span></div>
            <button class="text-button" type="button" data-navigate="transportations"><span data-i18n="vehicle.openShipments"></span><span aria-hidden="true">→</span></button>
          </article>
        </div>
      </section>

      <section class="screen" id="view-transportations" data-screen="transportations">
        <div class="screen-heading page-heading">
          <div><span class="eyebrow" data-i18n="transportations.eyebrow"></span><h1 data-i18n="nav.transportations"></h1><p data-i18n="transportations.subtitle"></p></div>
          <button class="btn btn-outline" id="refreshTransportations" type="button"><span aria-hidden="true">↻</span><span data-i18n="actions.refresh"></span></button>
        </div>
        <div class="panel filters-panel">
          <label class="filter-label"><span data-i18n="transportations.filter"></span>
            <select id="transportStatusFilter">
              <option value="all" data-i18n="filter.all"></option>
              <option value="pending" data-i18n="status.pending"></option>
              <option value="confirmed" data-i18n="status.confirmed"></option>
              <option value="in_transit" data-i18n="status.in_transit"></option>
              <option value="delivered" data-i18n="status.delivered"></option>
              <option value="cancelled" data-i18n="status.cancelled"></option>
            </select>
          </label>
          <span class="results-count" id="transportResultsCount"></span>
        </div>
        <div id="transportationsList" class="request-list"></div>
      </section>

      <section class="screen" id="view-planning" data-screen="planning">
        <div class="screen-heading page-heading">
          <div><span class="eyebrow" data-i18n="planning.eyebrow"></span><h1 data-i18n="nav.planning"></h1><p data-i18n="planning.subtitle"></p></div>
        </div>
        <div class="planning-layout">
          <aside class="planning-aside panel">
            <div class="planning-intro">
              <span class="panel-icon-large" aria-hidden="true">＋</span>
              <div><h2 data-i18n="planning.asideTitle"></h2><p data-i18n="planning.asideText"></p></div>
            </div>
            <div class="planning-steps">
              <div><span>01</span><strong data-i18n="planning.stepOne"></strong></div>
              <div><span>02</span><strong data-i18n="planning.stepTwo"></strong></div>
              <div><span>03</span><strong data-i18n="planning.stepThree"></strong></div>
            </div>
          </aside>
          <div class="panel request-panel">
            <div id="requestGuest" class="guest-state">
              <span class="guest-icon">Q</span>
              <h2 data-i18n="planning.loginTitle"></h2>
              <p data-i18n="planning.loginText"></p>
              <div class="button-row">
                <button class="btn btn-primary" id="requestLoginButton" type="button" data-i18n="auth.login"></button>
                <button class="btn btn-outline" id="requestRegisterButton" type="button" data-i18n="auth.register"></button>
              </div>
            </div>
            <form id="requestForm" class="form-grid hidden">
              <div class="form-heading full-field"><div><span class="eyebrow" data-i18n="planning.formKicker"></span><h2 data-i18n="planning.formTitle"></h2></div><p data-i18n="planning.formText"></p></div>
              <label><span data-i18n="form.origin"></span><input name="origin" required minlength="2" maxlength="120" data-i18n-placeholder="form.originPlaceholder"></label>
              <label><span data-i18n="form.destination"></span><input name="destination" required minlength="2" maxlength="120" data-i18n-placeholder="form.destinationPlaceholder"></label>
              <label><span data-i18n="form.cargoType"></span><select name="cargo_type" required>
                <option value="" data-i18n="form.choose"></option><option value="Жиһаз" data-i18n="cargo.furniture"></option><option value="Құрылыс материалдары" data-i18n="cargo.building"></option><option value="Азық-түлік" data-i18n="cargo.food"></option><option value="Тұрмыстық техника" data-i18n="cargo.appliances"></option><option value="Басқа" data-i18n="cargo.other"></option>
              </select></label>
              <label><span data-i18n="form.weight"></span><input name="weight_kg" type="number" min="0.1" max="50000" step="0.1" required data-i18n-placeholder="form.weightPlaceholder"></label>
              <label><span data-i18n="form.date"></span><input name="transport_date" type="date" required></label>
              <label><span data-i18n="form.phone"></span><input name="phone" type="tel" minlength="7" maxlength="30" required data-i18n-placeholder="form.phonePlaceholder"></label>
              <label class="full-field"><span data-i18n="form.comment"></span><textarea name="comment" rows="3" maxlength="1000" data-i18n-placeholder="form.commentPlaceholder"></textarea></label>
              <button class="btn btn-primary full-field submit-button" type="submit"><span data-i18n="form.submit"></span><span aria-hidden="true">→</span></button>
            </form>
          </div>
        </div>
        <section class="panel planning-requests">
          <div class="panel-heading"><div><span class="eyebrow" data-i18n="planning.listKicker"></span><h2 data-i18n="planning.listTitle"></h2></div><button class="btn btn-outline" id="refreshPlanning" type="button"><span aria-hidden="true">↻</span><span data-i18n="actions.refresh"></span></button></div>
          <div id="planningRequests" class="request-list"></div>
          <div id="adminRequestsWrap" class="admin-requests-wrap hidden">
            <div class="panel-heading admin-heading"><div><span class="eyebrow" data-i18n="planning.adminKicker"></span><h2 data-i18n="planning.adminTitle"></h2></div></div>
            <div id="adminRequests" class="request-list"></div>
          </div>
        </section>
      </section>

      <section class="screen" id="view-rates" data-screen="rates">
        <div class="screen-heading page-heading">
          <div><span class="eyebrow" data-i18n="rates.eyebrow"></span><h1 data-i18n="nav.rates"></h1><p data-i18n="rates.subtitle"></p></div>
        </div>
        <div class="rates-banner panel">
          <div class="rates-banner-icon">₸</div>
          <div><span class="eyebrow" data-i18n="rates.quoteKicker"></span><h2 data-i18n="rates.quoteTitle"></h2><p data-i18n="rates.quoteText"></p></div>
          <button class="btn btn-primary" type="button" data-navigate="planning"><span data-i18n="rates.requestQuote"></span><span aria-hidden="true">↗</span></button>
        </div>
        <div class="rates-grid">
          <article class="panel rate-card"><div class="rate-card-top"><span class="rate-number">01</span><span class="rate-card-icon" aria-hidden="true">↔</span></div><h2 data-i18n="rates.cardOneTitle"></h2><p data-i18n="rates.cardOneText"></p><span class="rate-detail" data-i18n="rates.cardOneDetail"></span></article>
          <article class="panel rate-card"><div class="rate-card-top"><span class="rate-number">02</span><span class="rate-card-icon" aria-hidden="true">▱</span></div><h2 data-i18n="rates.cardTwoTitle"></h2><p data-i18n="rates.cardTwoText"></p><span class="rate-detail" data-i18n="rates.cardTwoDetail"></span></article>
          <article class="panel rate-card"><div class="rate-card-top"><span class="rate-number">03</span><span class="rate-card-icon" aria-hidden="true">◎</span></div><h2 data-i18n="rates.cardThreeTitle"></h2><p data-i18n="rates.cardThreeText"></p><span class="rate-detail" data-i18n="rates.cardThreeDetail"></span></article>
        </div>
        <aside class="rates-disclaimer"><span aria-hidden="true">i</span><p data-i18n="rates.disclaimer"></p></aside>
      </section>

      <section class="screen" id="view-settings" data-screen="settings">
        <div class="screen-heading page-heading">
          <div><span class="eyebrow" data-i18n="settings.eyebrow"></span><h1 data-i18n="nav.settings"></h1><p data-i18n="settings.subtitle"></p></div>
        </div>
        <div class="settings-grid">
          <section class="panel settings-panel">
            <div class="panel-heading"><div><span class="eyebrow" data-i18n="settings.languageKicker"></span><h2 data-i18n="settings.languageTitle"></h2></div><span class="settings-icon" aria-hidden="true">Aa</span></div>
            <p data-i18n="settings.languageText"></p>
            <label class="settings-language"><span data-i18n="language.label"></span><select id="settingsLanguageSelect"><option value="kk">Қазақша</option><option value="ru">Русский</option></select></label>
            <span class="save-note"><i></i><span data-i18n="settings.savedNote"></span></span>
          </section>
          <section class="panel settings-panel">
            <div class="panel-heading"><div><span class="eyebrow" data-i18n="settings.accountKicker"></span><h2 data-i18n="settings.accountTitle"></h2></div><span class="settings-icon">Q</span></div>
            <div class="account-summary"><span class="profile-avatar large">Q</span><div><strong id="settingsName" data-i18n="settings.guestName"></strong><small id="settingsRole" data-i18n="settings.guestRole"></small><small id="settingsEmail"></small></div></div>
            <p data-i18n="settings.accountText"></p>
            <button class="btn btn-outline hidden" id="settingsLogout" type="button" data-i18n="auth.logout"></button>
            <button class="btn btn-primary" id="settingsLogin" type="button" data-i18n="auth.login"></button>
          </section>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <a class="brand footer-brand" href="#dashboard"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M16 4v24M4 16h24M7.5 7.5l17 17m0-17-17 17" /></svg></span><span class="brand-name">Qamqor <span>Cargo</span></span></a>
      <p data-i18n="footer.caption"></p>
      <span>© 2026 Qamqor Cargo</span>
    </footer>
  </div>

  <div class="modal hidden" id="authModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-backdrop" type="button" data-close="true" aria-label="Close"></button>
    <div class="modal-card">
      <button class="modal-close" id="modalClose" type="button" data-i18n-aria="modal.close" aria-label="Close">×</button>
      <span class="eyebrow">QAMQOR CARGO</span>
      <h2 id="modalTitle" data-i18n="auth.login"></h2>
      <form id="authForm" class="auth-form">
        <label id="registerNameWrap" class="hidden"><span data-i18n="auth.fullName"></span><input name="full_name" minlength="2" maxlength="120" autocomplete="name"></label>
        <label id="registerPhoneWrap" class="hidden"><span data-i18n="form.phone"></span><input name="phone" minlength="7" maxlength="30" autocomplete="tel"></label>
        <label><span data-i18n="auth.email"></span><input name="email" type="email" required maxlength="255" autocomplete="email"></label>
        <label><span data-i18n="auth.password"></span><input name="password" type="password" required minlength="8" maxlength="128" autocomplete="current-password"></label>
        <button class="btn btn-primary submit-button" type="submit" id="authSubmit" data-i18n="auth.login"></button>
      </form>
      <p class="modal-switch" id="authSwitch"><span data-i18n="auth.noAccount"></span> <button type="button" id="switchAuth" data-i18n="auth.register"></button></p>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/static/js/app.js" defer></script>
</body>
</html>
