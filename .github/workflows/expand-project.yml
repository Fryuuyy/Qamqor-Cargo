name: Expand Qamqor Cargo source
on:
  push:
    paths:
      - 'Qamqor_Cargo_Render_Ready.zip'
      - '.github/workflows/expand-project.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack project into repository root
        run: |
          if [ -f Qamqor_Cargo_Render_Ready.zip ]; then
            unzip -o Qamqor_Cargo_Render_Ready.zip -d /tmp/qamqor
            cp -a /tmp/qamqor/zhuk_tasymaldau/. .
            rm Qamqor_Cargo_Render_Ready.zip
          fi
      - name: Commit expanded source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Deploy-ready Qamqor Cargo source"
            git push
          fi
